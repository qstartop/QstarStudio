<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Qstar Games</title>
  <style>
    /* reset & base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0b0e17;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      color: #f0f4ff;
    }

    .site-card {
      max-width: 780px;
      width: 100%;
      background: rgba(18, 24, 38, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 48px 48px 40px 40px;
      padding: 2.8rem 2rem 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
      transition: box-shadow 0.25s;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .studio-title {
      text-align: center;
      font-size: 3.4rem;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 1.8rem;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(0, 180, 255, 0.2);
      word-break: break-word;
    }
    .studio-title span {
      background: linear-gradient(135deg, #b7e4ff, #7ac7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .game-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start; /* 改为 flex-start 让按钮有空间 */
      gap: 2.8rem 2.2rem; /* 增加垂直间距，为按钮留空间 */
      margin: 2rem 0 2.8rem 0;
      min-height: 100px;
      padding: 0.5rem 0 1.5rem 0; /* 底部留白 */
    }

    .game-item {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: #1e263b;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s;
      cursor: default;
      will-change: transform;
      overflow: visible; /* 关键：允许按钮超出显示 */
      flex-shrink: 0;
    }

    .game-item:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 14px 24px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1);
    }

    .game-icon-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 28px;
      display: block;
    }

    /* 按钮容器 - 使用绝对定位放在图标下方 */
    .store-buttons {
      position: absolute;
      bottom: -32px; /* 从图标底部向下偏移 */
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(10, 14, 23, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 14px;
      border-radius: 60px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) translateY(6px);
      transition: opacity 0.25s ease, visibility 0.25s, transform 0.25s ease;
      white-space: nowrap;
      pointer-events: none;
      z-index: 10;
      min-width: max-content;
    }

    .game-item:hover .store-buttons {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .store-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 40px;
      background: #2f3a57;
      color: #eef5ff;
      text-decoration: none;
      letter-spacing: 0.3px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      line-height: 1;
      min-width: 56px;
      text-align: center;
    }

    .store-btn:first-child {
      background: #3c8d3c;
      border-color: rgba(120, 200, 120, 0.2);
    }
    .store-btn:first-child:hover {
      background: #4ba84b;
      transform: scale(1.03);
      box-shadow: 0 0 12px rgba(70, 200, 70, 0.2);
    }

    .store-btn:last-child {
      background: #2a4b7a;
      border-color: rgba(80, 150, 255, 0.2);
    }
    .store-btn:last-child:hover {
      background: #3a6a9e;
      transform: scale(1.03);
      box-shadow: 0 0 12px rgba(60, 140, 255, 0.2);
    }

    .store-btn:active {
      transform: scale(0.96);
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
      margin: 0.8rem 0 1.4rem 0;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 1.8rem 2.5rem;
      margin-top: 0.2rem;
      font-size: 1rem;
    }

    .footer-links a, .footer-links .email-link {
      color: #b0c7e5;
      text-decoration: none;
      font-weight: 450;
      letter-spacing: 0.3px;
      padding: 4px 2px;
      border-bottom: 1px solid transparent;
      transition: color 0.15s, border-color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .footer-links a:hover, .footer-links .email-link:hover {
      color: #ffffff;
      border-bottom-color: rgba(120, 180, 255, 0.3);
    }

    .footer-links .email-link {
      background: none;
      border: none;
      font: inherit;
      cursor: pointer;
      padding: 4px 2px;
      border-bottom: 1px solid transparent;
    }

    .footer-links .email-link:hover {
      border-bottom-color: rgba(120, 180, 255, 0.3);
    }

    .hint-text {
      text-align: center;
      margin: 1.6rem 0 0.2rem;
      font-size: 0.8rem;
      opacity: 0.4;
      color: #9bb1d0;
      letter-spacing: 0.3px;
      font-weight: 300;
    }

    /* 响应式调整 */
    @media (max-width: 520px) {
      .site-card {
        padding: 1.8rem 1.2rem 1.8rem;
        border-radius: 32px;
      }
      .studio-title {
        font-size: 2.6rem;
      }
      .game-item {
        width: 78px;
        height: 78px;
        border-radius: 24px;
      }
      .game-icon-img {
        border-radius: 24px;
      }
      .store-buttons {
        padding: 6px 10px;
        gap: 5px;
        bottom: -28px;
      }
      .store-btn {
        font-size: 0.6rem;
        padding: 4px 10px;
        min-width: 44px;
      }
      .game-grid {
        gap: 2.4rem 1.8rem;
        padding-bottom: 1rem;
      }
      .footer-links {
        gap: 1.2rem 1.8rem;
        font-size: 0.9rem;
        flex-direction: row;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 400px) {
      .game-grid {
        gap: 2rem 1.2rem;
      }
      .game-item {
        width: 70px;
        height: 70px;
      }
      .store-buttons {
        bottom: -24px;
        padding: 4px 8px;
      }
      .store-btn {
        font-size: 0.55rem;
        padding: 3px 8px;
        min-width: 38px;
      }
    }
  </style>
</head>
<body>
  <div class="site-card">
    <h1 class="studio-title"><span>Qstar Games</span></h1>

    <div class="game-grid" id="gameGrid">
      <!-- 初始游戏图标 -->
      <div class="game-item" data-game="galaxy">
        <img class="game-icon-img" src="game1.png" alt="游戏图标">
        <div class="store-buttons">
          <a href="#" class="store-btn" data-store="google">Google Play</a>
          <a href="#" class="store-btn" data-store="appstore">App Store</a>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="footer-links">
      <a href="privacy.html" class="policy-link">📄 Privacy Policy</a>
      <button class="email-link" id="emailButton">✉️ info@gtop.top</button>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      const gameGrid = document.getElementById('gameGrid');

      function addGameIcon(imageSrc, googleLink, appleLink) {
        if (!imageSrc) return;

        const gameItem = document.createElement('div');
        gameItem.className = 'game-item';
        gameItem.setAttribute('data-game', 'custom-' + Date.now());

        const img = document.createElement('img');
        img.className = 'game-icon-img';
        img.src = imageSrc;
        img.alt = '游戏图标';
        gameItem.appendChild(img);

        const btnWrapper = document.createElement('div');
        btnWrapper.className = 'store-buttons';

        const googleBtn = document.createElement('a');
        googleBtn.className = 'store-btn';
        googleBtn.setAttribute('data-store', 'google');
        googleBtn.textContent = 'Google Play';
        googleBtn.href = googleLink || '#';
        googleBtn.target = '_blank';
        googleBtn.rel = 'noopener noreferrer';

        const appleBtn = document.createElement('a');
        appleBtn.className = 'store-btn';
        appleBtn.setAttribute('data-store', 'appstore');
        appleBtn.textContent = 'App Store';
        appleBtn.href = appleLink || '#';
        appleBtn.target = '_blank';
        appleBtn.rel = 'noopener noreferrer';

        btnWrapper.appendChild(googleBtn);
        btnWrapper.appendChild(appleBtn);
        gameItem.appendChild(btnWrapper);
        gameGrid.appendChild(gameItem);
      }

      window.addEventListener('DOMContentLoaded', function() {
<!--        addGameIcon('game2.png', 'https://play.google.com/store/apps/details?id=com.qstar.demo', 'https://apps.apple.com/app/id123456789');-->
<!--        addGameIcon('game3.png', 'https://play.google.com/store/apps/details?id=com.qstar.arcade', 'https://apps.apple.com/app/id987654321');-->

        const firstGame = document.querySelector('.game-item');
        if (firstGame) {
          const googleBtn = firstGame.querySelector('.store-btn[data-store="google"]');
          const appleBtn = firstGame.querySelector('.store-btn[data-store="appstore"]');
          if (googleBtn) googleBtn.href = 'https://play.google.com/store/apps/details?id=com.qstar.gem3d';
          if (appleBtn) appleBtn.href = 'https://apps.apple.com/app/id111111111';
        }
      });

      const emailBtn = document.getElementById('emailButton');
      if (emailBtn) {
        emailBtn.addEventListener('click', function(e) {
          e.preventDefault();
          window.location.href = 'mailto:info@gtop.top';
        });
      }
    })();
  </script>
</body>
</html>
